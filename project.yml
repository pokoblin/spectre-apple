# Generate Spectre.xcodeproj with `xcodegen generate` (the project file is not committed).
name: Spectre
options:
  bundleIdPrefix: org.ghost.spectre
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  # English is the source language and the fallback for languages the app
  # doesn't have (docs/localization.md).
  developmentLanguage: en

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # String Catalogs (*.xcstrings): the compiler lists the strings it finds.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GDPKit:
    path: Packages/GDPKit
  SpectreKit:
    path: Packages/SpectreKit

targets:
  Spectre:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/Shared
      - path: App/macOS
        destinationFilters: [macOS]
      - path: App/iOS
        destinationFilters: [iOS]
    dependencies:
      - package: GDPKit
      - package: SpectreKit
    settings:
      base:
        PRODUCT_NAME: Spectre
        PRODUCT_BUNDLE_IDENTIFIER: org.ghost.spectre.apple
        MARKETING_VERSION: "0.1.6"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spectre
        # App/Shared/AppIcon.icon, made in Icon Composer's format (docs/app-icon.md).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPad trackpad and mouse clicks arrive as .indirectPointer touches with their buttons.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Asked the first time the microphone button is turned on (gdp-spec.md §10.1).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Spectre sends your microphone to the remote desktop while you have it turned on."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Spectre connects to ghost hosts and servers on your local network."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/macOS/Spectre.entitlements
        ENABLE_HARDENED_RUNTIME: YES
