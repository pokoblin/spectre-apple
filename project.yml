# Generate Spectre.xcodeproj with `xcodegen generate` (the project file is not committed).
name: Spectre
options:
  bundleIdPrefix: org.ghost.spectre
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  # English is the source language and the fallback for languages the app
  # doesn't have (docs/localization.md).
  developmentLanguage: en

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # String Catalogs (*.xcstrings): the compiler lists the strings it finds.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GDPKit:
    path: Packages/GDPKit
  SpectreKit:
    path: Packages/SpectreKit
  # The Mac's updates (App/macOS/Updates.swift).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"

targets:
  Spectre:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/Shared
      - path: App/macOS
        destinationFilters: [macOS]
        excludes: [Info.plist]
      - path: App/iOS
        destinationFilters: [iOS]
        excludes: [FileSharing.plist]
    dependencies:
      - package: GDPKit
      - package: SpectreKit
      - package: Sparkle
        destinationFilters: [macOS]
    settings:
      base:
        PRODUCT_NAME: Spectre
        PRODUCT_BUNDLE_IDENTIFIER: org.ghost.spectre.apple
        MARKETING_VERSION: "0.6.4"
        CURRENT_PROJECT_VERSION: "23"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spectre
        # App/Shared/AppIcon.icon, made in Icon Composer's format (docs/app-icon.md).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad and iPhone: the tint of every control (App/iOS/Assets.xcassets,
        # docs/ipad-layout.md). The Mac keeps the system's accent color.
        "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME[sdk=iphone*]": AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPad trackpad and mouse clicks arrive as .indirectPointer touches with their buttons.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Asked the first time voice input listens (docs/voice-input.md).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Spectre listens while you hold or tap the microphone key, and types what you say on the remote desktop."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Spectre connects to ghost hosts and servers on your local network."
        # Downloads go to Documents, which the Files app shows as On My
        # iPad › Spectre (docs/file-transfer.md).
        "INFOPLIST_FILE[sdk=iphone*]": App/iOS/FileSharing.plist
        # The Mac's update feed and the public EdDSA key its updates are
        # signed with, for App/macOS/Info.plist. The private key stays in the
        # releaser's Keychain (scripts/make-appcast.sh). Without the public
        # key the app doesn't check for updates.
        "INFOPLIST_FILE[sdk=macosx*]": App/macOS/Info.plist
        SPARKLE_FEED_URL: https://github.com/pokoblin/spectre-apple/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "C+a4szkANblshcOgVCwmNnIXxkalY2xBS0GI7DLur6Q="
        # Sparkle.framework is embedded in Contents/Frameworks. A target for
        # both platforms gets only iOS's @executable_path/Frameworks, so the
        # Mac app wouldn't launch without this.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/macOS/Spectre.entitlements
        ENABLE_HARDENED_RUNTIME: YES
